name: Rules audio alignment
on:
  push:
    branches: [rule123-aud]
    paths: ['public/audio/rules/**', 'scripts/align-rules.py', '.github/workflows/rules-alignment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install development-only aligner
        run: python -m pip install faster-whisper==1.1.1 requests==2.32.5 huggingface-hub==0.34.4 ctranslate2==4.6.0
      - name: Transcribe original audio and calculate word timings
        run: python scripts/align-rules.py
