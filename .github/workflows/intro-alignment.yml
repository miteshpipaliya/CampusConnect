name: Introduction alignment
on:
  push:
    branches: [intro-Aud]
    paths: ['public/audio/introduction.mp3', 'scripts/align-introduction.py', '.github/workflows/intro-alignment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install development-only aligner
        run: python -m pip install faster-whisper==1.1.1
      - name: Transcribe original audio and calculate word timings
        run: python scripts/align-introduction.py
